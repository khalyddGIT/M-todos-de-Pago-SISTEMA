  <rect x="292" y="160" width="24" height="150" rx="6" fill="url(#accent)"/>
  <rect x="192" y="250" width="32" height="24" rx="4" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
  <rect x="288" y="250" width="32" height="24" rx="4" fill="#fef08a" stroke="#d97706" stroke-width="2"/>
